<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Создание листа ознакомления')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
    <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Ознакомление', 'Создание листа'} })}"></div>
    <h1 class="h3 mb-4">Создание листа ознакомления</h1>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card mb-4">
        <div class="card-body p-4">
            <form th:action="@{/acquaintance/preview}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-medium">Подписанный ЛНА <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{documentId}" required>
                        <option value="">Выберите документ</option>
                        <option th:each="document : ${documents}" th:value="${document.id}"
                                th:text="${(document.number ?: 'без номера') + ' — ' + document.title}"></option>
                    </select>
                    <div class="form-text">Лист нельзя создать для неподписанного документа.</div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Аудитория</label>
                        <select class="form-select" th:field="*{audienceType}">
                            <option th:each="type : ${audienceTypes}" th:value="${type}" th:text="${type.title}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Срок ознакомления <span class="text-danger">*</span></label>
                        <input class="form-control" type="date" th:field="*{deadline}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Подразделение или должность</label>
                    <input class="form-control" type="text" th:field="*{audienceRef}"
                           placeholder="Введите ID выбранного подразделения/должности">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Список сотрудников</label>
                    <input class="form-control" type="text" th:field="*{employeeIds}"
                           placeholder="ID сотрудников через запятую">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary" type="submit"><i class="bi bi-eye me-1"></i>Предпросмотр состава</button>
                    <button class="btn btn-primary" type="submit" formaction="/acquaintance"><i class="bi bi-check-lg me-1"></i>Создать лист</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card" th:if="${preview}">
        <div class="card-header"><h2 class="h6 mb-0">Предпросмотр состава участников</h2></div>
        <div class="card-body">
            <p class="mb-2">Участников всего: <strong class="text-primary" th:text="${preview.total}">0</strong></p>
            <ul class="list-group list-group-flush border rounded">
                <li class="list-group-item py-2" th:each="user : ${preview.users}" th:text="${user.fullName + ' — ' + user.email}"></li>
            </ul>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
