<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ознакомление с документом')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Ознакомление', 'Подтверждение'} })}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>
    <h1 th:text="${sheet.document.title}">Документ</h1>
    <p>Ознакомьтесь с документом до <strong th:text="${sheet.deadline ?: 'указанного срока'}">срока</strong>.</p>
    <div class="alert alert-warning">
        Учебный прототип: код подтверждения сгенерирован приложением и показывается вместо SMS.
        <strong class="ms-2" th:text="${confirmationCode}">000000</strong>
    </div>
    <form th:action="@{/acquaintance/{id}/acknowledge(id=${sheet.id})}" method="post">
        <input type="hidden" name="expectedCode" th:value="${confirmationCode}">
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="read" required>
            <label class="form-check-label" for="read">Я ознакомился с документом и подтверждаю это действие.</label>
        </div>
        <label class="form-label" for="code">Код подтверждения</label>
        <input class="form-control mb-3" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" required>
        <button class="btn btn-primary" type="submit" th:disabled="${mark.status.name() == 'ACKNOWLEDGED'}">Подтвердить ознакомление</button>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
