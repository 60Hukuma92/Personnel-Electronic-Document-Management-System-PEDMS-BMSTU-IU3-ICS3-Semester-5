<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Согласование')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Согласование'} })}"></div>
  <h1 class="h3 mb-3">Ожидают моего решения</h1>
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead><tr><th>Номер</th><th>Название</th><th>Вид</th><th>Обновлён</th><th></th></tr></thead>
      <tbody>
        <tr th:if="${documents.empty}">
          <td colspan="5" class="text-muted text-center py-4">Нет документов, ожидающих вашего решения</td>
        </tr>
        <tr th:each="document : ${documents}">
          <td th:text="${document.number ?: 'без номера'}"></td>
          <td th:text="${document.title}"></td>
          <td th:text="${document.type?.name}"></td>
          <td th:text="${#temporals.format(document.updatedAt, 'dd.MM.yyyy HH:mm')}"></td>
          <td class="text-end"><a class="btn btn-sm btn-primary" th:href="@{/documents/{id}(id=${document.id})}">Рассмотреть</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
