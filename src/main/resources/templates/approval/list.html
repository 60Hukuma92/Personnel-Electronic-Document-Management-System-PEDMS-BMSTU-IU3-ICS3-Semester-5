<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Согласование')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
  <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Согласование'} })}"></div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1">Ожидают моего решения</h1>
      <p class="text-muted mb-0">Документы, требующие вашего согласования, подписания или рассмотрения</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Номер</th><th>Название</th><th>Вид</th><th>Обновлён</th><th class="text-end">Действие</th></tr></thead>
          <tbody>
            <tr th:if="${documents.empty}">
              <td colspan="5" class="text-muted text-center py-5">
                <i class="bi bi-check-all fs-1 text-success d-block mb-2"></i>
                Нет документов, ожидающих вашего решения
              </td>
            </tr>
            <tr th:each="document : ${documents}">
              <td class="fw-bold"><a th:href="@{/documents/{id}(id=${document.id})}" th:text="${document.number ?: 'без номера'}"></a></td>
              <td class="fw-medium text-dark" th:text="${document.title}"></td>
              <td><span class="badge text-bg-primary" th:text="${document.type?.name}"></span></td>
              <td class="text-muted small" th:text="${#temporals.format(document.updatedAt, 'dd.MM.yyyy HH:mm')}"></td>
              <td class="text-end"><a class="btn btn-sm btn-primary" th:href="@{/documents/{id}(id=${document.id})}"><i class="bi bi-eye me-1"></i>Рассмотреть</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
