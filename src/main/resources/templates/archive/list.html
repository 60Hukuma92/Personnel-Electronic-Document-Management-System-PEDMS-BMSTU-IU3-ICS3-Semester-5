<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Архивный реестр')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Архив'} })}"></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Архивный реестр</h1>
    <form th:action="@{/archive/archive-signed}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline-primary" type="submit">Архивировать подписанные документы</button>
    </form>
  </div>

  <form class="row g-2 mb-3" th:action="@{/archive}" method="get">
    <div class="col-md-5">
      <input class="form-control" name="text" th:value="${text}" placeholder="Номер или название">
    </div>
    <div class="col-md-5">
      <select class="form-select" name="typeId">
        <option value="">Все виды документов</option>
        <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"
                th:selected="${selectedTypeId != null and selectedTypeId == type.id}"></option>
      </select>
    </div>
    <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Найти</button></div>
  </form>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead><tr><th>Номер</th><th>Название</th><th>Вид</th><th>Архивирован</th><th>Срок хранения до</th></tr></thead>
      <tbody>
      <tr th:each="document : ${documents}">
        <td><a th:href="@{/documents/{id}(id=${document.id})}" th:text="${document.number ?: '—'}"></a></td>
        <td th:text="${document.title}"></td>
        <td th:text="${document.type?.name}"></td>
        <td th:text="${#temporals.format(document.updatedAt, 'dd.MM.yyyy')}"></td>
        <td th:text="${#temporals.format(document.updatedAt.plusYears(document.type?.retentionYears ?: 5), 'dd.MM.yyyy')}"></td>
      </tr>
      </tbody>
    </table>
  </div>
  <p class="text-muted" th:if="${documents.empty}">В архиве нет документов</p>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
