<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Архивный реестр')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
  <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Архив'} })}"></div>
  <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-3">
    <i class="bi bi-check-circle-fill me-2 fs-5"></i><span th:text="${successMessage}"></span>
  </div>

  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1">Архивный реестр</h1>
      <p class="text-muted mb-0">Архивные кадровые документы и сроки их хранения</p>
    </div>
    <form th:action="@{/archive/archive-signed}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline-primary" type="submit">
        <i class="bi bi-archive me-1"></i>Архивировать подписанные
      </button>
    </form>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <form class="row g-2" th:action="@{/archive}" method="get">
        <div class="col-md-5">
          <input class="form-control" name="text" th:value="${text}" placeholder="Номер или название документа">
        </div>
        <div class="col-md-5">
          <select class="form-select" name="typeId">
            <option value="">Все виды документов</option>
            <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"
                    th:selected="${selectedTypeId != null and selectedTypeId == type.id}"></option>
          </select>
        </div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-search me-1"></i>Найти</button></div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Номер</th><th>Название</th><th>Вид</th><th>Архивирован</th><th>Хранение до</th></tr></thead>
          <tbody>
          <tr th:if="${documents.empty}">
            <td colspan="5" class="text-muted text-center py-5">
              <i class="bi bi-archive fs-2 d-block mb-1"></i>
              В архиве нет документов
            </td>
          </tr>
          <tr th:each="document : ${documents}">
            <td class="fw-bold"><a th:href="@{/documents/{id}(id=${document.id})}" th:text="${document.number ?: '—'}"></a></td>
            <td class="fw-medium text-dark" th:text="${document.title}"></td>
            <td><span class="badge text-bg-secondary" th:text="${document.type?.name}"></span></td>
            <td class="text-muted" th:text="${#temporals.format(document.updatedAt, 'dd.MM.yyyy')}"></td>
            <td class="fw-medium text-primary" th:text="${#temporals.format(document.updatedAt.plusYears(document.type?.retentionYears ?: 5), 'dd.MM.yyyy')}"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
