<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: breadcrumbs(${ {pageTitle} })}"></div>

  <div class="card shadow-sm border-0 mt-3">
    <div class="card-body p-4">
      <span class="badge text-bg-secondary mb-3" th:text="${stage}">Этап</span>
      <h1 class="h4" th:text="${pageTitle}">Раздел</h1>
      <p class="text-muted mb-3" th:text="${featureDescription}">
        Функциональность раздела реализуется на следующем этапе.
      </p>
      <p class="mb-4">
        Этот раздел пока находится в разработке. Ниже приведён перечень функций,
        которые будут доступны после завершения соответствующего этапа НИРС.
      </p>
      <a class="btn btn-primary" th:href="@{/dashboard}">
        Вернуться в личный кабинет
      </a>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
