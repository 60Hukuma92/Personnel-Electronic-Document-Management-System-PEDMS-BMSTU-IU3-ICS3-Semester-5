<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Новый пользователь - PEDMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">ИС КЭДО (PEDMS)</a>
    <a href="/users" class="btn btn-outline-light btn-sm">Назад к списку</a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Создание нового пользователя</h4>
        </div>
        <div class="card-body">
          <form th:action="@{/users}" th:object="${user}" method="post">
            <div class="mb-3">
              <label class="form-label">ФИО</label>
              <input type="text" class="form-control" th:field="*{fullName}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" th:field="*{email}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Роль</label>
              <select class="form-select" th:field="*{role}">
                <option value="EMPLOYEE">Сотрудник</option>
                <option value="MANAGER">Руководитель</option>
                <option value="HR">Кадровик</option>
                <option value="ADMIN">Администратор</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Статус</label>
              <select class="form-select" th:field="*{status}">
                <option value="ACTIVE">Активен</option>
                <option value="BLOCKED">Заблокирован</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Сохранить</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
