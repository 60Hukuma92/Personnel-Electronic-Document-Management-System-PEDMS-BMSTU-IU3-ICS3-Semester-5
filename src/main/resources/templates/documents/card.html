<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Карточка документа')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Документы', 'Карточка'} })}"></div>

  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h1 class="h3 mb-1" th:text="${document.title}"></h1>
      <div class="text-muted" th:text="${document.number ?: 'Регистрационный номер ещё не присвоен'}"></div>
    </div>
    <span class="badge text-bg-secondary fs-6" th:text="${document.status.title}"></span>
  </div>

  <dl class="row">
    <dt class="col-sm-3">Вид</dt><dd class="col-sm-9" th:text="${document.type?.name}"></dd>
    <dt class="col-sm-3">Автор</dt><dd class="col-sm-9" th:text="${document.author?.fullName}"></dd>
    <dt class="col-sm-3">Создан</dt><dd class="col-sm-9" th:text="${#temporals.format(document.createdAt, 'dd.MM.yyyy HH:mm')}"></dd>
  </dl>

  <h2 class="h5 mt-4">Поля документа</h2>
  <dl class="row">
    <th:block th:each="entry : ${document.contentJson}">
      <dt class="col-sm-3" th:text="${entry.key}"></dt>
      <dd class="col-sm-9" th:text="${entry.value}"></dd>
    </th:block>
  </dl>

  <div class="d-flex gap-2 mt-3">
    <a th:if="${document.status.isEditable}" class="btn btn-outline-primary"
       th:href="@{/documents/{id}/edit(id=${document.id})}">Редактировать</a>
    <form th:if="${document.status.name == 'IN_APPROVAL'}" th:action="@{/documents/{id}/recall(id=${document.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline-danger" type="submit">Отозвать</button>
    </form>
  </div>

  <h2 class="h5 mt-4">Вложения</h2>
  <ul class="list-group mb-3" th:if="${!attachments.empty}">
    <li class="list-group-item" th:each="attachment : ${attachments}">
      <span th:text="${attachment.fileName}"></span>
      <span class="text-muted small ms-2" th:text="${attachment.fileSize / 1024} + ' КБ'"></span>
    </li>
  </ul>
  <p class="text-muted" th:if="${attachments.empty}">Вложений нет</p>

  <form th:if="${document.status.isEditable}" class="row g-2"
        th:action="@{/documents/{id}/attachments(id=${document.id})}" method="post" enctype="multipart/form-data">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="col-md-6"><input class="form-control" type="file" name="file" required></div>
    <div class="col-md-3"><button class="btn btn-outline-primary" type="submit">Загрузить</button></div>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
