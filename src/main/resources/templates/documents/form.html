<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Документ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
  <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Документы', (editing ? 'Редактирование' : 'Новый документ')} })}"></div>
  <h1 class="h3 mb-4" th:text="${editing ? 'Редактирование документа' : 'Новый документ'}"></h1>

  <div class="card">
    <div class="card-body p-4">
      <form th:action="${editing ? '/documents/' + documentId + '/edit' : '/documents'}" method="post" th:object="${form}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Вид документа <span class="text-danger">*</span></label>
            <select class="form-select" th:field="*{typeId}" onchange="if(this.value) location.href='/documents/create?typeId='+this.value">
              <option value="">Выберите вид</option>
              <option th:each="item : ${types}" th:value="${item.id}" th:text="${item.name}"></option>
            </select>
            <div class="text-danger small mt-1" th:text="${fieldErrors['typeId']}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Название документа <span class="text-danger">*</span></label>
            <input class="form-control" th:field="*{title}" th:classappend="${fieldErrors['title'] != null} ? 'is-invalid'">
            <div class="invalid-feedback" th:text="${fieldErrors['title']}"></div>
          </div>
        </div>

        <div class="row g-3 mt-2 p-3 bg-light rounded-3 border" th:if="${type != null}">
          <h2 class="h6 text-muted mb-1 w-100">Поля шаблона: <span class="text-dark fw-bold" th:text="${type.name}"></span></h2>
          <div th:each="field : ${type.templateJson['fields']}"
               th:class="${field['halfWidth']} ? 'col-md-6' : 'col-md-12'">
            <label class="form-label fw-medium" th:text="${field['label']}"></label>
            <input th:if="${field['type'] == 'text'}" class="form-control"
                   th:name="|fields[${field['key']}]|" th:value="${form.fields[field['key']]}"
                   th:classappend="${fieldErrors[field['key']] != null} ? 'is-invalid'">
            <input th:if="${field['type'] == 'date'}" type="date" class="form-control"
                   th:name="|fields[${field['key']}]|" th:value="${form.fields[field['key']]}"
                   th:classappend="${fieldErrors[field['key']] != null} ? 'is-invalid'">
            <textarea th:if="${field['type'] == 'textarea'}" class="form-control" rows="4"
                      th:name="|fields[${field['key']}]|" th:text="${form.fields[field['key']]}"
                      th:classappend="${fieldErrors[field['key']] != null} ? 'is-invalid'"></textarea>
            <select th:if="${field['type'] == 'select'}" class="form-select"
                    th:name="|fields[${field['key']}]|"
                    th:classappend="${fieldErrors[field['key']] != null} ? 'is-invalid'">
              <option value="">Выберите значение</option>
              <option th:each="option : ${field['options']}" th:value="${option['value']}"
                      th:text="${option['label']}"
                      th:selected="${form.fields[field['key']] == option['value']}"></option>
            </select>
            <div class="invalid-feedback" th:text="${fieldErrors[field['key']]}"></div>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>Сохранить черновик</button>
          <a class="btn btn-outline-secondary" th:href="@{/documents}">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
