<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Документы')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Документы</h1>
    <a class="btn btn-primary" th:href="@{/documents/create}">
      <i class="bi bi-plus-lg me-1"></i>Создать документ
    </a>
  </div>

  <form class="row g-2 mb-3" th:action="@{/documents}" method="get">
    <div class="col-md-3">
      <input class="form-control" name="text" th:value="${text}" placeholder="Номер или название">
    </div>
    <div class="col-md-2">
      <select class="form-select" name="typeId">
        <option value="">Все виды</option>
        <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"
                th:selected="${selectedTypeId == type.id}"></option>
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" name="status">
        <option value="">Все статусы</option>
        <option th:each="item : ${statuses}" th:value="${item.name}" th:text="${item.title}"
                th:selected="${selectedStatus != null and selectedStatus.name == item.name}"></option>
      </select>
    </div>
    <div class="col-md-2"><input class="form-control" type="date" name="from" th:value="${from}"></div>
    <div class="col-md-2"><input class="form-control" type="date" name="to" th:value="${to}"></div>
    <div class="col-md-1"><button class="btn btn-outline-secondary w-100" type="submit">Найти</button></div>
  </form>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead><tr><th>Номер</th><th>Название</th><th>Вид</th><th>Статус</th><th>Обновлён</th></tr></thead>
      <tbody>
      <tr th:if="${documents.empty}">
        <td colspan="5" class="text-muted text-center py-4">Документы не найдены</td>
      </tr>
      <tr th:each="document : ${documents}">
        <td><a th:href="@{/documents/{id}(id=${document.id})}" th:text="${document.number ?: 'без номера'}"></a></td>
        <td th:text="${document.title}"></td>
        <td th:text="${document.type?.name}"></td>
        <td><span class="badge text-bg-secondary" th:text="${document.status.title}"></span></td>
        <td th:text="${#temporals.format(document.updatedAt, 'dd.MM.yyyy HH:mm')}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
