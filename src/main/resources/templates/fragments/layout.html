<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' — ИС КЭДО'">ИС КЭДО</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/pedms.css}" rel="stylesheet">
</head>
<body>

<!-- Шапка с главным меню ИС КЭДО в корпоративном стиле -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <span class="brand-icon-box"><i class="bi bi-file-earmark-text"></i></span>ИС КЭДО
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
                aria-controls="mainMenu" aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}" th:classappend="${pageTitle == 'Мой кабинет'} ? 'active'">Мой кабинет</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/documents}" th:classappend="${pageTitle == 'Документы'} ? 'active'">Документы</a>
                </li>
                <li class="nav-item"
                    th:if="${currentUser != null and (currentUser.role.name() == 'MANAGER' or currentUser.role.name() == 'HR' or currentUser.role.name() == 'ADMIN')}">
                    <a class="nav-link" th:href="@{/approval}" th:classappend="${pageTitle == 'Согласование'} ? 'active'">Согласование</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/acquaintance}" th:classappend="${pageTitle == 'Ознакомление'} ? 'active'">Ознакомление</a>
                </li>
                <li class="nav-item"
                    th:if="${currentUser != null and (currentUser.role.name() == 'HR' or currentUser.role.name() == 'ADMIN')}">
                    <a class="nav-link" th:href="@{/reports}" th:classappend="${pageTitle == 'Отчёты'} ? 'active'">Отчёты</a>
                </li>
                <li class="nav-item"
                    th:if="${currentUser != null and (currentUser.role.name() == 'HR' or currentUser.role.name() == 'ADMIN')}">
                    <a class="nav-link" th:href="@{/archive}" th:classappend="${pageTitle == 'Архив' or pageTitle == 'Архивный реестр'} ? 'active'">Архив</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
                    <a class="nav-link" th:href="@{/admin/users}" th:classappend="${pageTitle == 'Учётные записи'} ? 'active'">Администрирование</a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notifications}" th:classappend="${pageTitle == 'Уведомления'} ? 'active'">
                        <i class="bi bi-bell me-1"></i>Уведомления
                        <span class="badge rounded-pill text-bg-danger ms-1" th:if="${unreadCount > 0}"
                              th:text="${unreadCount}">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown ms-lg-2">
                    <a class="nav-link dropdown-toggle d-inline-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                        <span class="user-avatar-circle"><i class="bi bi-person-fill"></i></span>
                        <span th:if="${currentUser != null}" th:text="${currentUser.fullName}">Пользователь</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <span class="dropdown-item-text small text-muted"
                                  th:if="${currentUser != null}"
                                  th:text="${currentUser.role.title} + ' · ' + ${currentUser.department?.name ?: '—'}">
                            </span>
                        </li>
                        <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear me-1"></i>Настройки</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                    <i class="bi bi-box-arrow-right me-1"></i>Выход
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Хлебные крошки -->
<div th:fragment="breadcrumbs(items)" class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}"><i class="bi bi-house-door me-1"></i>Мой кабинет</a></li>
            <li class="breadcrumb-item" th:each="item : ${items}" th:text="${item}">Раздел</li>
        </ol>
    </nav>
</div>

<!-- Клиентские скрипты -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/pedms.js}"></script>
</th:block>

</body>
</html>
