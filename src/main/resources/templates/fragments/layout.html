<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' — ИС КЭДО'">ИС КЭДО</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- Шапка с главным меню. Разделы меню соответствуют дереву функций
     (рисунок 2.3 записки) и показываются в зависимости от роли пользователя. -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-file-earmark-text me-2"></i>ИС КЭДО
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
                aria-controls="mainMenu" aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}" th:classappend="${pageTitle == 'Мой кабинет'} ? 'active'">Мой кабинет</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/documents}">Документы</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
                    <a class="nav-link" th:href="@{/admin/users}">Администрирование</a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notifications}">
                        <i class="bi bi-bell me-1"></i>Уведомления
                        <span class="badge rounded-pill text-bg-danger ms-1" th:if="${unreadCount > 0}"
                              th:text="${unreadCount}">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:if="${currentUser != null}" th:text="${currentUser.fullName}">Пользователь</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <span class="dropdown-item-text small text-muted"
                                  th:if="${currentUser != null}"
                                  th:text="${currentUser.role.title} + ' · ' + ${currentUser.department?.name ?: '—'}">
                            </span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                <button type="submit" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-box-arrow-right me-1"></i>Выход
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Хлебные крошки: набор переданных элементов -->
<div th:fragment="breadcrumbs(items)" class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Мой кабинет</a></li>
            <li class="breadcrumb-item" th:each="item : ${items}" th:text="${item}">Раздел</li>
        </ol>
    </nav>
</div>

<!-- Клиентские скрипты: библиотека Bootstrap нужна для выпадающего меню,
     сворачиваемого меню на узких экранах и подтверждения опасных действий. -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/pedms.js}"></script>
</th:block>

</body>
</html>
