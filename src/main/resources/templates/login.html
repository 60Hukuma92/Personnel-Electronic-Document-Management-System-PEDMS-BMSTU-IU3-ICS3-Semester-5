<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в систему — ИС КЭДО</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/pedms.css}" rel="stylesheet">
</head>
<body class="login-backdrop">
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh; padding: 2rem 0;">
        <div class="col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <div class="login-brand-badge mx-auto">
                    <i class="bi bi-file-earmark-text-fill"></i>
                </div>
                <h1 class="h3 mb-1 font-weight-bold">ИС КЭДО</h1>
                <p class="text-muted small mb-0">Кадровый электронный документооборот</p>
            </div>

            <div class="card login-card">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3 text-center">Авторизация</h2>

                    <div class="alert alert-danger py-2" th:if="${loginError}" role="alert">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        Неверный логин или пароль.
                    </div>

                    <div class="alert alert-success py-2" th:if="${logoutSuccess}" role="alert">
                        <i class="bi bi-check-circle me-1"></i>
                        Вы вышли из системы.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="email">Логин (email)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="ivanov@pedms.ru" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Пароль</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Введите пароль" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fs-6">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Войти в кабинет
                        </button>
                    </form>
                </div>
            </div>

            <div class="card mt-3 border-0 bg-white shadow-sm">
                <div class="card-body p-3 small">
                    <p class="mb-2 text-muted fw-bold">
                        <i class="bi bi-info-circle me-1 text-primary"></i>Демонстрационные учетные записи:
                    </p>
                    <table class="table table-sm table-borderless mb-0">
                        <tbody>
                        <tr><td><code>petrova@pedms.ru</code></td><td class="text-muted">Сотрудник</td><td rowspan="4" class="align-middle text-end"><span class="badge text-bg-info">pedms2026</span></td></tr>
                        <tr><td><code>ivanov@pedms.ru</code></td><td class="text-muted">Руководитель</td></tr>
                        <tr><td><code>sidorova@pedms.ru</code></td><td class="text-muted">Сотрудник ОК</td></tr>
                        <tr><td><code>admin@pedms.ru</code></td><td class="text-muted">Администратор</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
