<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Уведомления')}">
    <title>Уведомления — ИС КЭДО</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div th:replace="~{fragments/layout :: breadcrumbs(${'Уведомления'})}"></div>

    <h1 class="h3 mb-4">Уведомления</h1>

    <div class="card">
        <div class="card-body p-0">
            <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(notifications)}">
                <li class="list-group-item p-3" th:each="n : ${notifications}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge text-bg-primary me-2" th:text="${n.eventType.title}">Событие</span>
                            <span class="fw-medium text-dark" th:text="${n.body}">Текст уведомления</span>
                            <small class="text-muted d-block mt-1"
                                   th:text="${#temporals.format(n.createdAt, 'dd.MM.yyyy HH:mm')}"></small>
                        </div>
                        <form th:if="${n.isUnread}" th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-check2 me-1"></i>Прочитано</button>
                        </form>
                    </div>
                </li>
            </ul>
            <div class="text-muted text-center py-5" th:if="${#lists.isEmpty(notifications)}">
                <i class="bi bi-bell-slash fs-2 d-block mb-1"></i>
                Уведомлений пока нет.
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
