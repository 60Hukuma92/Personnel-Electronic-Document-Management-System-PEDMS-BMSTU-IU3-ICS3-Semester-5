<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Отчёты')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
    <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Отчёты'} })}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Отчёты и аналитика</h1>
    </div>

    <div th:replace="~{fragments/messages :: alerts}"></div>

    <form class="card card-body mb-4" method="get" th:action="@{/reports}">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label" for="kind">Отчёт</label>
                <select class="form-select" id="kind" name="kind" required>
                    <option th:each="item : ${kinds}" th:value="${item}" th:text="${item.title}"
                            th:selected="${item == selectedKind}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="from">Дата с</label>
                <input class="form-control" type="date" id="from" name="from" th:value="${from}">
            </div>
            <div class="col-md-2">
                <label class="form-label" for="to">Дата по</label>
                <input class="form-control" type="date" id="to" name="to" th:value="${to}">
            </div>
            <div class="col-md-2">
                <label class="form-label" for="departmentId">Подразделение</label>
                <select class="form-select" id="departmentId" name="departmentId">
                    <option value="">Все</option>
                    <option th:each="department : ${departments}" th:value="${department.id}"
                            th:text="${department.name}" th:selected="${department.id == selectedDepartmentId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="userId">Сотрудник</label>
                <select class="form-select" id="userId" name="userId">
                    <option value="">Не выбран</option>
                    <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.fullName}"
                            th:selected="${user.id == selectedUserId}"></option>
                </select>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-bar-chart me-1"></i>Показать
                </button>
                <a class="btn btn-outline-success"
                   th:if="${selectedKind != null}"
                   th:href="@{/reports/export(kind=${selectedKind},from=${from},to=${to},departmentId=${selectedDepartmentId},userId=${selectedUserId},format='xlsx')}">
                    <i class="bi bi-file-earmark-excel me-1"></i>XLSX
                </a>
                <a class="btn btn-outline-secondary"
                   th:if="${selectedKind != null}"
                   th:href="@{/reports/export(kind=${selectedKind},from=${from},to=${to},departmentId=${selectedDepartmentId},userId=${selectedUserId},format='csv')}">
                    <i class="bi bi-file-earmark-text me-1"></i>CSV
                </a>
            </div>
        </div>
    </form>

    <section th:if="${report != null}">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0" th:text="${report.title}">Отчёт</h2>
            <span class="text-muted" th:text="${report.summary}"></span>
        </div>
        <div class="table-responsive border rounded">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th th:each="header : ${report.headers}" th:text="${header}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(report.rows)}">
                    <td th:attr="colspan=${#lists.size(report.headers)}" class="text-center text-muted py-4">
                        Данных за выбранный период нет
                    </td>
                </tr>
                <tr th:each="row : ${report.rows}">
                    <td th:each="value : ${row}" th:text="${value}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
