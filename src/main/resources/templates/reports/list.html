<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Отчёты')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
    <div th:replace="~{fragments/layout :: breadcrumbs(${ {'Отчёты'} })}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Отчёты и аналитика</h1>
            <p class="text-muted mb-0">Кадровая аналитика, исполнительская дисциплина и реестры КЭДО</p>
        </div>
    </div>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="card mb-4">
        <div class="card-header d-flex align-items-center">
            <i class="bi bi-funnel me-2 text-primary"></i>
            <h2 class="h6 mb-0">Параметры отчёта</h2>
        </div>
        <div class="card-body">
            <form method="get" th:action="@{/reports}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1" for="kind">Вид отчёта</label>
                        <select class="form-select" id="kind" name="kind" required>
                            <option th:each="item : ${kinds}" th:value="${item}" th:text="${item.title}"
                                    th:selected="${item == selectedKind}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1" for="from">Дата с</label>
                        <input class="form-control" type="date" id="from" name="from" th:value="${from}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1" for="to">Дата по</label>
                        <input class="form-control" type="date" id="to" name="to" th:value="${to}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1" for="departmentId">Подразделение</label>
                        <select class="form-select" id="departmentId" name="departmentId">
                            <option value="">Все</option>
                            <option th:each="department : ${departments}" th:value="${department.id}"
                                    th:text="${department.name}" th:selected="${department.id == selectedDepartmentId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1" for="userId">Сотрудник</label>
                        <select class="form-select" id="userId" name="userId">
                            <option value="">Не выбран</option>
                            <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.fullName}"
                                    th:selected="${user.id == selectedUserId}"></option>
                        </select>
                    </div>
                    <div class="col-12 d-flex gap-2 mt-3">
                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-bar-chart me-1"></i>Сформировать отчёт
                        </button>
                        <a class="btn btn-outline-success"
                           th:if="${selectedKind != null}"
                           th:href="@{/reports/export(kind=${selectedKind},from=${from},to=${to},departmentId=${selectedDepartmentId},userId=${selectedUserId},format='xlsx')}">
                            <i class="bi bi-file-earmark-excel me-1"></i>Экспорт XLSX
                        </a>
                        <a class="btn btn-outline-secondary"
                           th:if="${selectedKind != null}"
                           th:href="@{/reports/export(kind=${selectedKind},from=${from},to=${to},departmentId=${selectedDepartmentId},userId=${selectedUserId},format='csv')}">
                            <i class="bi bi-file-earmark-text me-1"></i>Экспорт CSV
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <section class="card" th:if="${report != null}">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0"><i class="bi bi-table me-2"></i><span th:text="${report.title}">Отчёт</span></h2>
            <span class="badge text-bg-secondary" th:text="${report.summary}"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th th:each="header : ${report.headers}" th:text="${header}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(report.rows)}">
                        <td th:attr="colspan=${#lists.size(report.headers)}" class="text-center text-muted py-5">
                            <i class="bi bi-file-earmark-x fs-2 d-block mb-1"></i>
                            Данных за выбранный период не найдено
                        </td>
                    </tr>
                    <tr th:each="row : ${report.rows}">
                        <td th:each="value : ${row}" th:text="${value}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
