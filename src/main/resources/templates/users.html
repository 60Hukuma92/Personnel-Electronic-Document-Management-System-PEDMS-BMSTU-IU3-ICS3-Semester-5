<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей - PEDMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">ИС КЭДО (PEDMS)</a>
        <div class="d-flex">
            <a href="/users/create" class="btn btn-success btn-sm">Добавить пользователя</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Реестр пользователей системы</h2>

    <table class="table table-striped table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Статус</th>
            <th>Дата создания</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td>
                    <span class="badge" th:classappend="${user.status == 'BLOCKED'} ? 'bg-danger' : 'bg-success'"
                          th:text="${user.status}">
                    </span>
            </td>
            <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
        </tr>
        <tr th:if="${users.empty}">
            <td colspan="6" class="text-center text-muted py-4">Пользователи не найдены</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
